name: Check public service connectivity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe public HTTP endpoints
        shell: python
        run: |
          import json, urllib.request
          urls = [
              "https://gofrantic.com/v1/board",
              "https://gofrantic.com/openapi.json",
              "https://api.gofrantic.com/mcp.json",
          ]
          for url in urls:
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "service-connectivity-check/1.0", "Accept": "application/json"})
                  with urllib.request.urlopen(request, timeout=25) as response:
                      raw = response.read()
                      value = json.loads(raw)
                      print(json.dumps({"url": url, "status": response.status, "bytes": len(raw), "keys": list(value)[:12] if isinstance(value, dict) else None}))
              except Exception as error:
                  print(json.dumps({"url": url, "error": str(error)}))
