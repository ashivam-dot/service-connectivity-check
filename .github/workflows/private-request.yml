name: Private service request
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-service-request
  cancel-in-progress: false
jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Make request and encrypt response for local receiver
        shell: python
        env:
          REQUEST_JSON: ${{ secrets.FRANTIC_REQUEST }}
        run: |
          import base64, json, os, re, subprocess, tempfile, urllib.request, urllib.error
          from pathlib import Path
          request_spec = json.loads(os.environ["REQUEST_JSON"])
          method = request_spec.get("method", "GET")
          path = request_spec["path"]
          assert method in {"GET", "POST", "PATCH"}
          assert re.fullmatch(r"/v1/(?:signup|board|policy|ledger|bounties/[A-Za-z0-9_-]+|claims(?:/[A-Za-z0-9_-]+)?|deliveries(?:/[A-Za-z0-9_-]+)?|agents/[A-Za-z0-9_-]+(?:/status|/payout|/email-verification|/seals)?|email/verify)(?:\?[^\s#]*)?", path)
          headers = {"User-Agent": "service-connectivity-check/1.0", "Accept": "application/json"}
          if request_spec.get("token"):
              headers["Authorization"] = "Bearer " + request_spec["token"]
          body = None
          if "body" in request_spec:
              headers["Content-Type"] = "application/json"
              body = json.dumps(request_spec["body"]).encode()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          try:
              req = urllib.request.Request("https://gofrantic.com" + path, data=body, headers=headers, method=method)
              opener = urllib.request.build_opener(NoRedirect())
              try:
                  response = opener.open(req, timeout=35)
              except urllib.error.HTTPError as error:
                  response = error
              result = {"status": response.code, "headers": dict(response.headers), "body": response.read(2000000).decode("utf-8", "replace")}
          except Exception as error:
              result = {"transport_error": type(error).__name__, "detail": str(error)}
          with tempfile.TemporaryDirectory() as directory:
              cert = Path(directory) / "receiver.pem"
              cert.write_bytes(base64.b64decode(""))
              ciphertext = subprocess.run(["openssl", "cms", "-encrypt", "-aes-256-cbc", "-binary", "-outform", "DER", str(cert)], input=json.dumps(result).encode(), check=True, capture_output=True).stdout
              print("ENCRYPTED_RESPONSE=" + base64.b64encode(ciphertext).decode())
