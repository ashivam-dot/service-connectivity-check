name: Private OpenTask request
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-opentask-request
  cancel-in-progress: false
jobs:
  request:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Make request and encrypt response for local receiver
        shell: python
        env:
          REQUEST_JSON: ${{ secrets.OPENTASK_REQUEST }}
        run: |
          import base64, json, os, re, subprocess, tempfile, urllib.request, urllib.error, urllib.parse
          from pathlib import Path
          request_payload = json.loads(os.environ["REQUEST_JSON"])
          def perform(request_spec):
              method = request_spec.get("method", "GET")
              path = request_spec["path"]
              assert method in {"GET", "POST", "PATCH"}
              host = request_spec["host"]
              assert host == "opentask.ai"
              route = path.split("?", 1)[0]
              allowed_read = {"/.well-known/opentask-agent-authorization", "/api/tasks/cmpupoqmm0027kw04351wcfhz", "/api/tasks/cmv11tua3007606jj2ne1mbwc", "/api/agent/me", "/api/agent/me/payout-methods", "/api/agent/onboarding/status", "/api/agent/me/discovery-readiness", "/api/agent/me/capabilities", "/api/agent/bids", "/api/agent/contracts", "/api/agent/notifications"}
              allowed_post = {"/api/agent/auth/register/challenge", "/api/agent/auth/register/complete", "/api/agent/auth/token", "/api/agent/me/payout-methods", "/api/agent/me/capabilities", "/api/agent/tasks/cmpupoqmm0027kw04351wcfhz/bids", "/api/agent/tasks/cmv11tua3007606jj2ne1mbwc/bids"}
              assert (method == "GET" and route in allowed_read) or (method == "POST" and route in allowed_post) or (method == "PATCH" and route == "/api/agent/me")
              headers = {"User-Agent": "service-connectivity-check/1.0", "Accept": "application/json"}
              if request_spec.get("token"):
                  headers["Authorization"] = "DPoP " + request_spec["token"]
              if request_spec.get("dpop"):
                  headers["DPoP"] = request_spec["dpop"]
              if request_spec.get("idempotency_key"):
                  headers["Idempotency-Key"] = request_spec["idempotency_key"]
              body = None
              if "body" in request_spec:
                  if route == "/api/agent/auth/token":
                      assert request_spec["body"].get("grant_type") == "refresh_token"
                      headers["Content-Type"] = "application/x-www-form-urlencoded"
                      body = urllib.parse.urlencode(request_spec["body"]).encode()
                  else:
                      headers["Content-Type"] = "application/json"
                      body = json.dumps(request_spec["body"]).encode()
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, req, fp, code, msg, headers, newurl):
                      return None
              try:
                  req = urllib.request.Request("https://" + host + path, data=body, headers=headers, method=method)
                  opener = urllib.request.build_opener(NoRedirect())
                  try:
                      response = opener.open(req, timeout=35)
                  except urllib.error.HTTPError as error:
                      response = error
                  result = {"status": response.code, "headers": dict(response.headers), "body": response.read(2000000).decode("utf-8", "replace")}
              except Exception as error:
                  result = {"transport_error": type(error).__name__, "detail": str(error)}
              return result

          if "requests" not in request_payload:
              result = perform(request_payload)
          else:
              specs = request_payload["requests"]
              assert 1 <= len(specs) <= 6
              steps = []
              guard_error = None
              for spec in specs:
                  step = perform(spec)
                  steps.append({"path": spec["path"], **step})
                  if step.get("status") not in (200, 201):
                      break
                  if spec["path"].startswith("/api/agent/onboarding/status"):
                      data = json.loads(step["body"])
                      if (data.get("checkpoint") or {}).get("code") != "activated":
                          guard_error = "Seller setup is incomplete; no bid attempted."
                          break
                  if spec["path"] in {"/api/tasks/cmpupoqmm0027kw04351wcfhz", "/api/tasks/cmv11tua3007606jj2ne1mbwc"}:
                      task = json.loads(step["body"])["task"]
                      bid_route = "/api/agent/tasks/" + task["id"] + "/bids"
                      bid_spec = next((item for item in specs if item["path"] == bid_route and item["method"] == "POST"), None)
                      actions = json.loads(step["body"]).get("availableActions", [])
                      can_bid = any(action.get("action") == "create_bid" and action.get("state") == "available" and action.get("invocation", {}).get("endpoint") == bid_route for action in actions)
                      if bid_spec and (task.get("status") != "open" or task.get("executionMode") != "pitch" or task.get("updatedAt") != bid_spec["body"]["expectedTaskUpdatedAt"] or not can_bid):
                          guard_error = "Task terms or availability changed; no bid attempted."
                          break
              status = 409 if guard_error else steps[-1].get("status", 502)
              result = {"status": status, "body": json.dumps({"steps": steps, "guard_error": guard_error})}
          with tempfile.TemporaryDirectory() as directory:
              cert = Path(directory) / "receiver.pem"
              cert.write_bytes(base64.b64decode(""))
              ciphertext = subprocess.run(["openssl", "cms", "-encrypt", "-aes-256-cbc", "-binary", "-outform", "DER", str(cert)], input=json.dumps(result).encode(), check=True, capture_output=True).stdout
              encoded = base64.b64encode(ciphertext).decode()
              for offset in range(0, len(encoded), 4096):
                  print("ENCRYPTED_RESPONSE_PART=" + encoded[offset:offset+4096])
